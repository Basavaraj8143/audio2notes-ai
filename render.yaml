services:
  - type: web
    name: audio2notes-api
    runtime: python
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && pip install openai-whisper && python -m spacy download en_core_web_sm
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: OPENROUTER_APP_TITLE
        value: Audio2Notes AI
      - key: OPENROUTER_HTTP_REFERER
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
